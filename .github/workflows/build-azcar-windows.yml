name: AZ Car 3D Windows x64
on:
  workflow_dispatch:
  push:
    branches: [feature/az-car-3d, feature/az-car-3d-realism-20261013]
    paths:
      - 'az-car-3d/**'
      - '.github/workflows/build-azcar-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot 4.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.5.1-stable'
          $base = "https://github.com/godotengine/godot-builds/releases/download/$version"
          Invoke-WebRequest "$base/Godot_v4.5.1-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "$base/Godot_v4.5.1-stable_export_templates.tpz" -OutFile templates.tpz
          Copy-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = Join-Path $env:APPDATA 'Godot/export_templates/4.5.1.stable'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item templates/templates/* $dest -Recurse -Force
          $exe = Get-ChildItem godot -Filter '*console.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Godot console executable missing' }
          "GODOT_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
      - name: Import and validate Godot project
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path az-car-3d --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
      - name: Validate scripts and driving scenarios
        shell: pwsh
        run: |
          python az-car-3d/tools/validate.py $env:GODOT_EXE
          if ($LASTEXITCODE -ne 0) { throw 'Script validation failed' }
          & $env:GODOT_EXE --headless --path az-car-3d --script res://tests/run.gd 2>&1 | Tee-Object tests.log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path tests.log -Pattern 'SCRIPT ERROR|ERROR:')) { throw 'Gameplay tests failed' }
          & $env:GODOT_EXE --headless --path az-car-3d --script res://tests/cockpit_checks.gd
          if ($LASTEXITCODE -ne 0) { throw 'Cockpit tests failed' }
      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force az-car-3d/build/windows | Out-Null
          & $env:GODOT_EXE --headless --path az-car-3d --export-release 'Windows Desktop' build/windows/AZCar3D.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          if (-not (Test-Path az-car-3d/build/windows/AZCar3D.exe)) { throw 'EXE missing' }
          $files = Get-ChildItem az-car-3d/build/windows -File
          if ($files.Count -eq 0) { throw 'No output files' }
      - name: Start the exported game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = (Resolve-Path az-car-3d/build/windows/AZCar3D.exe).Path
          $logPath = Join-Path (Split-Path $exePath) 'runtime-smoke.log'
          $process = Start-Process -FilePath $exePath -ArgumentList @('--headless','--quit-after','120','--log-file',$logPath) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Exported game timed out' }
          if ($process.ExitCode -ne 0) { throw 'Exported game failed to start' }
          if (-not (Test-Path $logPath)) { throw 'Runtime log missing' }
          if (Select-String -Path $logPath -Pattern 'SCRIPT ERROR|ERROR:') { Get-Content $logPath; throw 'Exported game runtime errors' }
          Remove-Item -LiteralPath $logPath
      - name: Package portable Windows game
        shell: pwsh
        run: |
          Compress-Archive -Path az-car-3d/build/windows/* -DestinationPath AZCar3D-Windows-x64.zip -Force
          if ((Get-Item AZCar3D-Windows-x64.zip).Length -lt 1024) { throw 'ZIP unexpectedly small' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path AZCar3D-Windows-x64.zip))
          try {
            foreach ($required in @('AZCar3D.exe','AZCar3D.pck')) {
              $entry = $archive.GetEntry($required)
              if (-not $entry -or $entry.Length -eq 0) { throw "Missing or empty $required" }
              $stream = $entry.Open()
              try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
            }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: AZCar3D-Windows-x64-${{ github.sha }}
          path: AZCar3D-Windows-x64.zip
          if-no-files-found: error

  publish-release:
    needs: windows
    if: github.ref == 'refs/heads/feature/az-car-3d'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AZCar3D-Windows-x64-${{ github.sha }}
          path: release-assets
      - name: Verify packaged build
        run: |
          set -euo pipefail
          test -s release-assets/AZCar3D-Windows-x64.zip
          unzip -t release-assets/AZCar3D-Windows-x64.zip
          unzip -Z1 release-assets/AZCar3D-Windows-x64.zip | grep -Fx 'AZCar3D.exe'
          unzip -Z1 release-assets/AZCar3D-Windows-x64.zip | grep -Fx 'AZCar3D.pck'
      - name: Require Android validation of the same source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 90); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/az-car-3d-colombo.yml/runs?head_sha=$SOURCE_SHA&per_page=20" --jq '.workflow_runs | map(select(.head_sha == env.SOURCE_SHA)) | .[0].id // empty')
            if [ -n "$run" ]; then
              result=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "android") | .conclusion // empty')
              if [ "$result" = success ]; then verified=true; break; fi
              if [ -n "$result" ]; then echo "Android validation failed: $result"; exit 1; fi
            fi
            sleep 10
          done
          test "$verified" = true
      - name: Publish independent Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="azcar-windows-v0.7.0-build.${{ github.run_number }}"
          gh release create "$tag" release-assets/AZCar3D-Windows-x64.zip \
            --target "${{ github.sha }}" \
            --title "AZ Car 3D Windows v0.7.0 (Build ${{ github.run_number }})" \
            --notes "Portable Windows x64 build from feature/az-car-3d. Extract ZIP and launch AZCar3D.exe. Automated drivetrain and cockpit interaction checks passed. Preview: visual review and actual hardware validation remain necessary." \
            --prerelease

