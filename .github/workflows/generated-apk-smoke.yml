name: Smoke Test Generated Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'android-template/**'
      - '.github/workflows/generated-apk-smoke.yml'

permissions:
  contents: read

jobs:
  generate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Python generator
        run: python3 -m py_compile scripts/configure_template.py
      - name: Generate example website APK
        run: python3 scripts/configure_template.py --url 'https://example.com' --name 'WebToApp Smoke Test' --package 'com.webtoapp.smoketest' --orientation auto
      - name: Compile the generated Android app
        working-directory: android-template
        run: gradle assembleDebug --stacktrace
      - name: Upload generated test APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToApp-generated-smoke-test
          path: android-template/app/build/outputs/apk/debug/app-debug.apk
