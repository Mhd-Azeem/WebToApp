name: Publish Car3D Akurana v1
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for both exact matching Akurana builds and verify success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 38358456129 38358456123; do
            for attempt in $(seq 1 45); do
              status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.status')
              if [ "$status" = "completed" ]; then break; fi
              sleep 20
            done
            status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.status')
            result=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion')
            revision=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.head_sha')
            test "$status" = completed
            test "$result" = success
            test "$revision" = 29baa05453ef1869dfb4152ff363199e4fcfc0ba
          done
      - name: Download exact verified Android and Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p output/android output/windows
          gh run download 38358456129 --repo "$GH_REPO" --name AZ-Car-3D-Akurana-29baa05453ef1869dfb4152ff363199e4fcfc0ba --dir output/android
          gh run download 38358456123 --repo "$GH_REPO" --name AZCar3D-Akurana-Windows-x64-29baa05453ef1869dfb4152ff363199e4fcfc0ba --dir output/windows
          test -s output/android/AZ-Car-3D-Akurana.apk
          test -s output/windows/AZCar3D-Akurana-Windows-x64.zip
          unzip -t output/windows/AZCar3D-Akurana-Windows-x64.zip
          unzip -Z1 output/windows/AZCar3D-Akurana-Windows-x64.zip | grep -Fx AZCar3D-Akurana.exe
          unzip -Z1 output/windows/AZCar3D-Akurana-Windows-x64.zip | grep -Fx AZCar3D-Akurana.pck
          cp output/android/AZ-Car-3D-Akurana.apk output/AZ-Car-3D-Akurana.apk
          cp output/windows/AZCar3D-Akurana-Windows-x64.zip output/AZCar3D-Akurana-Windows-x64.zip
          cd output
          sha256sum AZ-Car-3D-Akurana.apk AZCar3D-Akurana-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish version 1 as an independent stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.AZ_CAR_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GitHub denied release creation with its built-in Actions token (HTTP 403). Add a repository Actions secret named AZ_CAR_RELEASE_TOKEN with Contents: Read and write permission, then manually run this workflow."
            exit 1
          fi
          tag=car3d-akurana-v1.0.0
          sha=29baa05453ef1869dfb4152ff363199e4fcfc0ba
          notes="Car3D Akurana version 1: sloped-terrain camera clearance, road visibility/contrast, road-based vehicle spawn, and map collision regression tests. Exact matching Android and Windows builds passed automated validation. Android debug-signed APK; Windows portable ZIP includes EXE and PCK. Real-device visual validation remains necessary."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version 1 already published, refusing to overwrite immutable release"
            exit 1
          fi
          gh release create "$tag" --target "$sha" --title "Car3D Akurana v1.0" --notes "$notes" --latest output/AZ-Car-3D-Akurana.apk output/AZCar3D-Akurana-Windows-x64.zip output/SHA256SUMS.txt
