name: AZ Car 3D Akurana APK
on:
  push:
    branches: [feature/az-car-3d-akurana-map, fix/az-car-3d-akurana-ground]
    paths: ['az-car-3d/**', '.github/workflows/az-car-3d-akurana.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: az-akurana-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 35 tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Install pinned Godot and matching templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          cp /tmp/templates/*.apk ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Restore persistent preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: az-car-3d-colombo-preview-signing-v1
      - name: Configure exporter and debug signing
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android az-car-3d/build
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and fail on script errors
        run: python3 az-car-3d/tools/validate.py godot
      - name: Drivetrain, touch controls and physical vehicle scenarios
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --script res://tests/run.gd 2>&1 | tee az-car-3d/build/tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/tests.log; then exit 1; fi
      - name: Cockpit interactions
        run: godot --headless --path az-car-3d --script res://tests/cockpit_checks.gd
      - name: Akurana geographic scene smoke checks
        run: godot --headless --path az-car-3d --script res://tests/akurana_smoke.gd
      - name: Full-footprint and watertight road validation
        run: |
          set -euo pipefail
          python3 -m pip install 'shapely==2.1.2' 'numpy==2.2.6'
          python3 az-car-3d/tools/check_akurana_geometry.py
          godot --headless --path az-car-3d --script res://tests/akurana_geometry.gd
          godot --headless --path az-car-3d --script res://tests/akurana_hill_driving.gd
      - name: Rendered instance and in-game screenshot inspection
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a godot --path az-car-3d --rendering-method gl_compatibility --script res://tests/akurana_instances.gd 2>&1 | tee az-car-3d/build/instances.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/instances.log; then exit 1; fi
          xvfb-run -a godot --path az-car-3d --rendering-method gl_compatibility --script res://tests/akurana_render.gd 2>&1 | tee az-car-3d/build/visual.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/visual.log; then exit 1; fi
          python3 az-car-3d/tools/check_visual_outputs.py
      - name: Prove car stays on physical Akurana terrain under gravity
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --script res://tests/akurana_ground_physics.gd 2>&1 | tee az-car-3d/build/ground-physics.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/ground-physics.log; then exit 1; fi
      - name: Export debug Android APK
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --export-debug Android build/AZ-Car-3D-Akurana.apk 2>&1 | tee az-car-3d/build/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/export.log; then exit 1; fi
          test -s az-car-3d/build/AZ-Car-3D-Akurana.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose az-car-3d/build/AZ-Car-3D-Akurana.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging az-car-3d/build/AZ-Car-3D-Akurana.apk | tee az-car-3d/build/apk-badging.txt
          printf '%s\n' '${{ github.sha }}' > az-car-3d/build/BUILD-COMMIT.txt
          cd az-car-3d/build
          sha256sum AZ-Car-3D-Akurana.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AZ-Car-3D-Akurana-${{ github.sha }}
          path: az-car-3d/build/
          if-no-files-found: error
