name: AZ Car 3D Colombo APK
on:
  push:
    branches: [feature/az-car-3d, feature/az-car-3d-realism-20261013]
    paths: ['az-car-3d/**', '.github/workflows/az-car-3d-colombo.yml', '.github/workflows/az-car-3d-controls-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: az-colombo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 35 tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Install pinned Godot and matching templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          cp /tmp/templates/*.apk ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Restore persistent preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: az-car-3d-colombo-preview-signing-v1
      - name: Configure exporter and debug signing
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android az-car-3d/build
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and fail on script errors
        run: python3 az-car-3d/tools/validate.py godot
      - name: Drivetrain, touch controls and physical vehicle scenarios
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --script res://tests/run.gd 2>&1 | tee az-car-3d/build/tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/tests.log; then exit 1; fi
      - name: Cockpit interactions
        run: godot --headless --path az-car-3d --script res://tests/cockpit_checks.gd
      - name: Export debug Android APK
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --export-debug Android build/AZ-Car-3D-Colombo.apk 2>&1 | tee az-car-3d/build/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/export.log; then exit 1; fi
          test -s az-car-3d/build/AZ-Car-3D-Colombo.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose az-car-3d/build/AZ-Car-3D-Colombo.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging az-car-3d/build/AZ-Car-3D-Colombo.apk | tee az-car-3d/build/apk-badging.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AZ-Car-3D-Android-${{ github.sha }}
          path: az-car-3d/build/
          if-no-files-found: error
      - name: Require Windows validation of the same source
        if: success() && github.ref == 'refs/heads/feature/az-car-3d'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 90); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/build-azcar-windows.yml/runs?head_sha=$SOURCE_SHA&per_page=20" --jq '.workflow_runs | map(select(.head_sha == env.SOURCE_SHA)) | .[0].id // empty')
            if [ -n "$run" ]; then
              result=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "windows") | .conclusion // empty')
              if [ "$result" = success ]; then verified=true; break; fi
              if [ -n "$result" ]; then echo "Windows validation failed: $result"; exit 1; fi
            fi
            sleep 10
          done
          test "$verified" = true
      - name: Publish versioned Android preview
        if: success() && github.ref == 'refs/heads/feature/az-car-3d'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd az-car-3d/build
          sha256sum AZ-Car-3D-Colombo.apk > SHA256SUMS-Android.txt
          tag="azcar-android-v0.7.0-build.${{ github.run_number }}"
          gh release create "$tag" AZ-Car-3D-Colombo.apk SHA256SUMS-Android.txt \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "AZ Car 3D Android v0.7.0 preview (Build ${{ github.run_number }})" \
            --notes "Source: $SOURCE_SHA. Godot import, drivetrain and vehicle scenarios, APK export and signature verification passed. Preserves the existing cached debug signing key. Preview: physical Android performance, touch ergonomics and listening tests remain unverified."
