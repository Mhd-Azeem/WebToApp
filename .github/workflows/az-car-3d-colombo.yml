name: AZ Car 3D Colombo APK
on:
  push:
    branches: [feature/az-car-3d]
    paths: ['az-car-3d/**', '.github/workflows/az-car-3d-colombo.yml', '.github/workflows/az-car-3d-controls-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: az-colombo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.ref == 'refs/heads/feature/az-car-3d'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 35 tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Install pinned Godot and matching templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          cp /tmp/templates/*.apk ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Restore persistent preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: az-car-3d-colombo-preview-signing-v1
      - name: Configure exporter and debug signing
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android az-car-3d/build
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and fail on script errors
        run: python3 az-car-3d/tools/validate.py godot
      - name: Transmission and vehicle collision tests
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --script res://tests/run.gd 2>&1 | tee az-car-3d/build/tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/tests.log; then exit 1; fi
      - name: Export debug Android APK
        run: |
          set -euo pipefail
          godot --headless --path az-car-3d --export-debug Android build/AZ-Car-3D-Colombo-debug.apk 2>&1 | tee az-car-3d/build/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' az-car-3d/build/export.log; then exit 1; fi
          test -s az-car-3d/build/AZ-Car-3D-Colombo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose az-car-3d/build/AZ-Car-3D-Colombo-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging az-car-3d/build/AZ-Car-3D-Colombo-debug.apk | tee az-car-3d/build/apk-badging.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AZ-Car-3D-Colombo-debug
          path: az-car-3d/build/
          if-no-files-found: error
      - name: Publish verified APK to rolling game release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: az-car-3d-latest
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd az-car-3d/build
          test -s AZ-Car-3D-Colombo-debug.apk
          sha256sum AZ-Car-3D-Colombo-debug.apk > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Latest verified AZ Car 3D Android preview. This release is refreshed automatically after every successful game build on feature/az-car-3d. Failed builds leave the previous APK available.

          Download AZ-Car-3D-Colombo-debug.apk below. Android arm64, Android 7.0+; debug-signed preview.

          Includes connected long Colombo-inspired roads and collision, procedural engine/start/shift/horn/brake/tire audio, analog speed and RPM gauges with gear readout in hood view, chase and cockpit cameras, manual/automatic transmission and native multitouch controls.

          v0.4 driving update: improved steering return and high-speed stability, stronger brakes and easier clutch engagement; gear limits 40 / 60 / 80 / 120 / 220 km/h; saved Settings traffic toggle with eight collision-aware vehicles; automatic rear-camera inset in both manual and automatic reverse. Performance mode disables antialiasing and shortens viewing distance. Rear view is capped at 15 FPS and stops rendering outside reverse.

          Camera button / V cycles chase, cockpit and hood. Speaker button / H holds the horn. Hold clutch to shift manually; stop and hold brake to select automatic D. Start with LOW quality.

          Godot validation, transmission/multitouch/road collision tests, Android export and APK signature verification must pass before publication. Device performance and audio quality still require physical Android testing. SHA256SUMS.txt contains the APK checksum.

          WebToApp and previous versioned game releases remain available separately.
          EOF
          printf '\nSource commit: [%s](https://github.com/%s/commit/%s)\n\nVerified build: %s\n' "$SOURCE_SHA" "$GH_REPO" "$SOURCE_SHA" "$RUN_URL" >> release-notes.md
          # Detect existing releases without hiding authentication/network failures.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > release-tags.txt
          if grep -Fxq "$RELEASE_TAG" release-tags.txt; then
            # This intentionally moves only the rolling game tag; version tags stay fixed.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" -F force=true
            gh release upload "$RELEASE_TAG" AZ-Car-3D-Colombo-debug.apk SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title 'AZ Car 3D — Latest APK' --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease --latest=false --title 'AZ Car 3D — Latest APK' --notes-file release-notes.md AZ-Car-3D-Colombo-debug.apk SHA256SUMS.txt
          fi
