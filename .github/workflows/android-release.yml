name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-template/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle assembleDebug --stacktrace

      - name: Rename signed APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../WebToApp-Android-Template.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebToApp-Android-Template
          path: WebToApp-Android-Template.apk

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: WebToApp Android Template - Latest
          prerelease: true
          make_latest: false
          files: WebToApp-Android-Template.apk
          body: |
            Automated installable development build of the WebToApp Android template.
            This build uses Android's standard debug signing so it can be installed for testing.
